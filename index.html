<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equity Defender - Embed Widget</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Compact Widget Styling */
        :root {
            --primary: #2563eb; --danger: #ef4444; --success: #10b981;
            --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #64748b;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0; /* Stripped margins to prevent iframe scroll */
            padding: 10px;
            background-color: transparent;
            color: var(--text-main);
            overflow: hidden; /* Kills the double scrollbar natively */
        }
        .widget-container {
            max-width: 100%;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .control-group { flex: 1; }
        .control-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); }
        input[type=range] { width: 100%; cursor: pointer; margin: 10px 0; }
        .val-display { font-size: 18px; font-weight: bold; color: var(--primary); }
        .charts-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .chart-box {
            flex: 1;
            text-align: center;
            padding: 15px;
            background: #f8fafc;
            border-radius: 8px;
        }
        .chart-box h4 { margin: 0 0 5px 0; font-size: 14px; }
        .canvas-container { position: relative; height: 140px; width: 100%; }
        .chart-footer { margin-top: 10px; font-size: 13px; font-weight: 600; }
        
        /* Slim Banner CTA */
        .cta-banner {
            background: #0f172a;
            color: white;
            border-radius: 8px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .cta-banner p { margin: 0; font-size: 14px; }
        .cta-banner strong { color: var(--danger); font-size: 18px; }
        .cta-button {
            background: var(--success);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            white-space: nowrap;
        }
        
        /* Mobile fallback: Let it scroll inside the widget if screen is tiny */
        @media (max-width: 600px) {
            body { overflow-y: auto; }
            .controls, .charts-container { flex-direction: column; }
            .cta-banner { justify-content: center; text-align: center; }
        }
    </style>
</head>
<body>

<div class="widget-container">
    <div class="controls">
        <div class="control-group">
            <label>Current Valuation</label>
            <input type="range" id="valSlider" min="1000000" max="50000000" step="1000000" value="10000000">
            <span class="val-display" id="valDisplay">$10,000,000</span>
        </div>
        <div class="control-group">
            <label>Desired Raise</label>
            <input type="range" id="raiseSlider" min="500000" max="20000000" step="500000" value="2000000">
            <span class="val-display" id="raiseDisplay">$2,000,000</span>
        </div>
    </div>

    <div class="charts-container">
        <div class="chart-box">
            <h4>The VC Route</h4>
            <div class="canvas-container"><canvas id="vcChart"></canvas></div>
            <div class="chart-footer">Ownership: <span id="vcOwnershipText">--</span>%</div>
        </div>
        <div class="chart-box">
            <h4>The Moonshine Route</h4>
            <div class="canvas-container"><canvas id="moonshineChart"></canvas></div>
            <div class="chart-footer">Ownership: 100%</div>
        </div>
    </div>

    <div class="cta-banner">
        <p>You lose <strong id="lossDisplay">$0</strong> in equity over 3 rounds.</p>
        <a href="https://yourbookinglink.com/jason" target="_blank" class="cta-button">Keep Your Equity</a>
    </div>
</div>

<script>
    const formatter = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
    const valSlider = document.getElementById('valSlider'), raiseSlider = document.getElementById('raiseSlider');
    const valDisplay = document.getElementById('valDisplay'), raiseDisplay = document.getElementById('raiseDisplay');
    const lossDisplay = document.getElementById('lossDisplay'), vcOwnershipText = document.getElementById('vcOwnershipText');

    const commonOptions = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, cutout: '65%' };

    let vcChart = new Chart(document.getElementById('vcChart').getContext('2d'), {
        type: 'doughnut', data: { datasets: [{ data: [100, 0], backgroundColor: ['#2563eb', '#ef4444'], borderWidth: 0 }] }, options: commonOptions
    });
    let moonChart = new Chart(document.getElementById('moonshineChart').getContext('2d'), {
        type: 'doughnut', data: { datasets: [{ data: [100, 0], backgroundColor: ['#10b981', '#cbd5e1'], borderWidth: 0 }] }, options: commonOptions
    });

    function calculate() {
        const currentVal = parseFloat(valSlider.value), raiseAmt = parseFloat(raiseSlider.value);
        valDisplay.innerText = formatter.format(currentVal); raiseDisplay.innerText = formatter.format(raiseAmt);
        
        const seriesADilution = raiseAmt / (currentVal + raiseAmt);
        let founderOwnership = 1.0 * (1 - seriesADilution) * (1 - 0.20) * (1 - 0.15);
        let vcOwnership = 1.0 - founderOwnership;

        const equityLost = (currentVal * 5) - ((currentVal * 5) * founderOwnership);
        
        vcOwnershipText.innerText = (founderOwnership * 100).toFixed(1);
        lossDisplay.innerText = formatter.format(equityLost);

        vcChart.data.datasets[0].data = [founderOwnership * 100, vcOwnership * 100];
        vcChart.update();
    }
    valSlider.addEventListener('input', calculate); raiseSlider.addEventListener('input', calculate); calculate();
</script>

</body>
</html>
